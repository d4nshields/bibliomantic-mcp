name: MCP reading judge
on:
  workflow_run:
    workflows: [MCP capture]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  judge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: mcp-captures
          path: ${{ runner.temp }}/mcp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Judge captured readings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EVAL_MODEL: ${{ vars.OPENAI_EVAL_MODEL }}
          OPENAI_JUDGE_MODEL: ${{ vars.OPENAI_JUDGE_MODEL }}
        run: |
          python3 scripts/compare/judge_mcp.py \
            "$RUNNER_TEMP/mcp/base/capture.json" "$RUNNER_TEMP/mcp/head/capture.json" \
            > "$RUNNER_TEMP/judgment.json"
          {
            echo '## MCP reading comparison'
            echo 'Advisory results. Baseline and candidate SHAs are recorded below.'
            echo '```json'
            cat "$RUNNER_TEMP/judgment.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
